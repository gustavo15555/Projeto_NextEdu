<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextEdu - Notas</title>
    <link rel="stylesheet" href="style.css">
    <script src="modoescuro.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="idioma.js" defer></script>
</head>
<body class="page-notas">

<div class="notas-app">
    <header class="notas-header">
        <a class="notas-back seta-voltar" href="home.html" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4M10.5 5.5 4 12l6.5 6.5"/></svg></a>
        <h1>Notas</h1>
    </header>

    <main class="notas-card">
        <div class="notas-purple-header">
            <h2>Matérias</h2>
            <div class="notas-select-container">
                <select id="semestre-select">
                    <option value="1">1º Semestre</option>
                    <option value="2">2º Semestre</option>
                </select>
                <span class="notas-dropdown">▼</span>
            </div>
        </div>

        <div class="notas-chart-wrapper">
            <canvas id="graficoNotas"></canvas>
        </div>
    </main>

    <section class="notas-card notas-performance">
        <div>
            <svg width="58" height="46" viewBox="0 0 50 40" fill="none">
                <rect x="5" y="28" width="6" height="10" rx="1" fill="#820AD1"/>
                <rect x="15" y="20" width="6" height="18" rx="1" fill="#820AD1"/>
                <rect x="25" y="12" width="6" height="26" rx="1" fill="#820AD1"/>
                <path d="M4 25L16 16L24 20L36 6" stroke="#003B46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M30 6H36V12" stroke="#003B46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="notas-performance-info">
            <h3>Desempenho geral</h3>
            <p class="notas-media">Média: <strong id="media-valor">8,8</strong></p>
            <p class="notas-evolution">↗ Boa evolução!</p>
        </div>
    </section>
</div>

<nav class="bottom-nav">
    <a href="home.html"><span class="nav-icon">⌂</span>Início</a>
    <a class="active" href="notas.html"><span class="nav-icon">▤</span>Notas</a>
    <a href="estudo.html"><span class="nav-icon">✎</span>Estudo</a>
    <a href="eventos.html"><span class="nav-icon">▦</span>Eventos</a>
    <a href="perfil.html"><span class="nav-icon">♙</span>Perfil</a>
</nav>

<script>
const ctx = document.getElementById('graficoNotas').getContext('2d');
const selectSemestre = document.getElementById('semestre-select');
const mediaElemento = document.getElementById('media-valor');

const dadosSemestres = {
    '1': { notas: [5.6, 9, 9, 7, 8, 9, 9, 10], media: '8,8' },
    '2': { notas: [7.8, 8.5, 9.5, 8.0, 9.0, 8.5, 10, 9.2], media: '8,9' }
};

const chart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Biologia','História','Artes','Geografia','Física','Química','Matemática','Português'],
        datasets: [{
            label: 'Nota',
            data: dadosSemestres['1'].notas,
            backgroundColor: '#820AD1',
            borderRadius: 6,
            barThickness: 14
        }]
    },
    options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false },
            tooltip: { enabled: true }
        },
        scales: {
            x: {
                min: 0,
                max: 10,
                ticks: { stepSize: 2, color: document.body.classList.contains('dark') ? '#FFFFFF' : '#333333', font: { size: 14, weight: 'bold' } },
                grid: { color: '#F0F0F0' },
                border: { display: false }
            },
            y: {
                ticks: { color: document.body.classList.contains('dark') ? '#FFFFFF' : '#4A4A4A', font: { size: 14, weight: 'bold' } },
                grid: { display: false },
                border: { display: false }
            }
        }
    }
});

document.addEventListener('idiomaNextEduAlterado', function(evento) {
    const idioma = evento.detail.idioma;
    const nomes = {
        pt: ['Biologia', 'História', 'Artes', 'Geografia', 'Física', 'Química', 'Matemática', 'Portugues'],
        en: ['Biology', 'History', 'Arts', 'Geography', 'Physics', 'Chemistry', 'Mathematics', 'Portuguese'],
        es: ['Biología', 'Historia', 'Artes', 'Geografía', 'Física', 'Química', 'Matemáticas', 'Portugués']
    };

    chart.data.labels = nomes[idioma] || nomes.pt;
    chart.data.datasets[0].label = idioma === 'en' ? 'Grade' : idioma === 'es' ? 'Nota' : 'Nota';
    chart.update();
});

const observadorTema = new MutationObserver(function() {
    const corTexto = document.body.classList.contains('dark') ? '#FFFFFF' : '#333333';
    chart.options.scales.x.ticks.color = corTexto;
    chart.options.scales.y.ticks.color = corTexto;
    chart.update();
});

observadorTema.observe(document.body, {
    attributes: true,
    attributeFilter: ['class']
});

selectSemestre.addEventListener('change', function(event) {
    const novosDados = dadosSemestres[event.target.value];
    chart.data.datasets[0].data = novosDados.notas;
    chart.update();
    mediaElemento.textContent = novosDados.media;
});
</script>

</body>
</html>
