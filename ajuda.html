<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextEdu - Ajuda</title>
    <script src="modoescuro.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <script src="idioma.js" defer></script>
    <script src="voltar.js" defer></script>
</head>
<body class="page-contato">
    <a href="perfil.html" class="conta-voltar seta-voltar voltar-flutuante js-voltar" aria-label="Voltar para perfil">
        <svg viewBox="0 0 24 24">
            <path d="M20 12H4M10.5 5.5 4 12l6.5 6.5"/>
        </svg>
    </a>
    <main class="container-contato">
        <img class="login-logo" src="logo-nextedu-png.png" data-light-src="logo-nextedu-png.png" data-dark-src="logo-nextedu2.png" alt="Logo da escola">
        <h1>Fale Conosco</h1>

        <form action="#" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Seu e-mail" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem aqui..." required></textarea>

            <button type="submit" class="btn-enviar">Enviar Mensagem</button>
        </form>
    </main>
</body>
</html>
